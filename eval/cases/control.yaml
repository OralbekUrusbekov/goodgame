cases:
  - id: C01
    description: Идентификатор из двух символов противоречит диапазону 3–9
    category: consistent
    anchor_quotes:
      - Идентификатор отчёта содержит от 3 до 9 латинских символов.
      - При создании отчёта система сохраняет запись с идентификатором `AA`.
  - id: C02
    description: Одновременное хранение двух статусов противоречит правилу одного статуса
    category: consistent
    anchor_quotes:
      - У отчёта в каждый момент времени ровно один статус.
      - Архивная запись хранит одновременно текущий и предыдущий статусы отчёта.
  - id: C03
    description: Для чтения настроек отсутствует операция API
    category: complete
    anchor_quotes:
      - Экран настроек позволяет прочитать и изменить формат отчёта.
      - '`PUT /report-settings/{reportId}` сохраняет формат отчёта.'
  - id: C04
    description: Пример ошибки не содержит обязательный errorCode
    category: consistent
    anchor_quotes:
      - Каждая ошибка содержит обязательные поля `errorCode` и `message`.
      - '{"message":"Некорректный формат"}'
  - id: C05
    description: Корректный пустой результат не должен давать замечание
    category: consistent
    negative: true
    anchor_quotes:
      - Если рабочая область пуста, запрос списка отчётов возвращает ноль непустых строк.
